<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Retorno OAuth</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  code { display: block; padding: .75rem; margin: .25rem 0 1rem; border: 1px solid; border-radius: .5rem; word-break: break-all; user-select: all; }
</style>
</head>
<body>
<h1>Retorno OAuth</h1>
<p>Página de retorno para pruebas locales. No envía datos a ningún lado: solo muestra lo que vino en la URL y la limpia del historial.</p>
<div id="out"></div>
<script>
  const params = new URLSearchParams(location.search);
  const out = document.getElementById('out');
  const add = (label, value) => {
    if (!value) return;
    const p = document.createElement('p'); p.textContent = label;
    const c = document.createElement('code'); c.textContent = value;
    out.append(p, c);
  };
  add('code', params.get('code'));
  add('state', params.get('state'));
  add('error', params.get('error'));
  add('error_description', params.get('error_description'));
  if (!out.hasChildNodes()) out.textContent = 'La URL no trae parámetros.';
  history.replaceState(null, '', location.pathname);
</script>
</body>
</html>
